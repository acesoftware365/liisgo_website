<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="website with links to spefic app">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="liisgo_website_09142025">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Liisgo Website</title>
  <link rel="manifest" href="manifest.json">
  <style>
    .wakenow-page {
      align-items: center;
      background: #f7f8fb;
      color: #141923;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }

    .wakenow-card {
      background: #ffffff;
      border: 1px solid #e5e8f0;
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(18, 28, 45, 0.10);
      max-width: 420px;
      padding: 28px;
      text-align: center;
      width: 100%;
    }

    .wakenow-card h1 {
      font-size: 28px;
      margin: 0 0 12px;
    }

    .wakenow-card p {
      color: #4d5666;
      font-size: 16px;
      line-height: 1.45;
      margin: 0 0 22px;
    }

    .wakenow-card button {
      background: #111827;
      border: 0;
      border-radius: 999px;
      color: #ffffff;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      padding: 13px 22px;
    }
  </style>
  <script>
    (function () {
      const prefix = "/wakenow/shared-alarm/";
      const path = window.location.pathname;

      if (!path.startsWith(prefix)) {
        return;
      }

      const payload = path.substring(prefix.length);
      const intentUrl =
        "intent://liisgo.com/wakenow/shared-alarm/" +
        payload +
        "#Intent;scheme=https;package=com.liisgo.wakenow;end";

      window.__WAKE_NOW_SHARED_ALARM__ = true;
      window.__OPEN_WAKE_NOW__ = function () {
        window.location.href = intentUrl;
      };

      document.title = "Open WakeNow";

      document.addEventListener("DOMContentLoaded", function () {
        document.body.className = "wakenow-page";
        document.body.innerHTML =
          '<main class="wakenow-card">' +
          "<h1>Open WakeNow</h1>" +
          "<p>This shared alarm opens in the WakeNow app.</p>" +
          '<button type="button" onclick="window.__OPEN_WAKE_NOW__()">Open WakeNow</button>' +
          "</main>";

        if (/Android/i.test(window.navigator.userAgent)) {
          window.setTimeout(window.__OPEN_WAKE_NOW__, 250);
        }
      });
    })();
  </script>
</head>
<body>
  <script>
    if (!window.__WAKE_NOW_SHARED_ALARM__) {
      const script = document.createElement("script");
      script.src = "flutter_bootstrap.js";
      script.async = true;
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
